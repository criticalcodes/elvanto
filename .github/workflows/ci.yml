name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version package.json claims to support, and current LTS.
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck and test both resolve the SDK to source, so neither needs a
      # build. The build runs anyway, because a broken d.ts emit would only ever
      # be caught here.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Guard the thing CI cannot otherwise see: that the published tarballs
      # contain what they should, and no more.
      - name: Check package contents
        run: |
          for dir in packages/*; do
            echo "--- $dir"
            (cd "$dir" && npm pack --dry-run 2>&1 | sed 's/^npm notice //')
          done
