version: 2
updates:
  # Grouped and monthly on purpose: this repository has a small, stable dependency
  # set, and a stream of individual PRs would be noise rather than signal.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        patterns: ['*']
        dependency-type: development
      production-dependencies:
        patterns: ['*']
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
